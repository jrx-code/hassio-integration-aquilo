# Pinned so a new Ruff release cannot turn a green lint red on its own: the
# default rule set grows between versions (0.17 added UP to it), and this repo
# is touched rarely enough that a surprise CI failure costs more than the rule.
target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "B", "SIM"]

[lint.isort]
known-first-party = ["custom_components"]
